# OpenCode Zen: upstream owns providers/opencode/ and keeps its prices (the OpenCode team runs
# models.dev, so they are first-party). This feed only reads the gateway's OpenAI-style model list
# and deletes upstream's file for a model the gateway no longer serves; it never adds a file. A
# list with more than one page changes nothing.
# The public list, read without a key: what OpenCode serves to anyone. The owner chose it over the
# keyed list, which shows only what one account has turned on.
name = "OpenCode Zen"
env = ["OPENCODE_API_KEY"]
api = "https://opencode.ai/zen/v1"
doc = "https://opencode.ai/docs/zen"
source = "OpenCode Zen model list (https://opencode.ai/zen/v1/models)"

[fetch]
url = "https://opencode.ai/zen/v1/models"
format = "models"
price_doc = "https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx"
