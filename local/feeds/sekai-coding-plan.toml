# SEKAI Gateway Coding Plan: a package paid up front in rupiah (IDR 50,000 for 7 days up to
# IDR 1,000,000 for 30 days, https://sekaigateway.xyz/en/coding), with no per-token price.
# The owner chose cost 0, so a router picks the plan before any per-token host.
# The feed reads the plan's model list (GET /v2/models, needs a key) and writes one file per
# listed model at cost 0; a model the list drops is deleted. The list carries no prices.
name = "SEKAI Gateway Coding Plan"
env = ["SEKAI_API_KEY"]
api = "https://api.sekaigateway.xyz/v2"
doc = "https://sekaigateway.xyz/en/docs"
source = "SEKAI Gateway Coding Plan model list (https://api.sekaigateway.xyz/v2/models), a prepaid plan"

[fetch]
url = "https://api.sekaigateway.xyz/v2/models"
format = "models"
key_env = "SEKAI_API_KEY"
free = true

# model_name = "<lab>/<model>" for a name that does not match a lab file name.
[map]
"gemini/gemini-3.8-flash-high" = "google/gemini-3.8-flash"
