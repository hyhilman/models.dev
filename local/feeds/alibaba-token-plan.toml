# Alibaba Token Plan: a monthly subscription, so there is no per-token price,
# and upstream's cost of 0 stays. The feed reads the plan's OpenAI-style model list and deletes
# upstream's file for a model the plan no longer serves. A list with more than one page changes
# nothing. The list left out 16 of upstream's 28 files (image and video models among them); the
# owner chose the list, hence max_retire = 0.75.
# The list needs the plan's key: [prices] alibaba_token_plan_api_key in doppelganger.secret.toml
# (gitignored), passed as ALIBABA_TOKEN_PLAN_API_KEY. Without it the feed is skipped (fetch.skip).
name = "Alibaba Token Plan"
env = ["ALIBABA_TOKEN_PLAN_API_KEY"]
api = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
doc = "https://www.alibabacloud.com/help/en/model-studio/token-plan-overview"
source = "Alibaba Token Plan model list (https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models)"

[fetch]
url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models"
format = "models"
key_env = "ALIBABA_TOKEN_PLAN_API_KEY"
max_retire = 0.75
