# Providers the price feed may write. It never touches a provider missing from this list. Add one
# only when the owner says so.
#
# A feed reads <provider>.json from PRICE_STATIC_DIR, or, when local/feeds/<provider>.toml has a
# [fetch] table, the list local/script/fetch-feeds.ts pulled from the provider.
providers = ["sumopod", "kenari", "alibaba"]

# Upstream owns these folders. The feed rewrites only the cost tables of upstream's files, deletes
# a file whose model the provider's live list no longer has, and never adds one. An upstream merge
# conflict there takes upstream's file (the next run writes the price again).
patch = ["kenari", "alibaba"]
