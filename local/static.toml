# Providers the price feed may write. It never touches a provider missing from this list. Add one
# only when the owner says so.
#
# A feed reads <provider>.json from PRICE_STATIC_DIR, or, when local/feeds/<provider>.toml has a
# [fetch] table, the list local/script/fetch-feeds.ts pulled from the provider.
providers = [
  "sumopod",
  "kenari",
  "alibaba",
  "alibaba-cn",
  "alibaba-coding-plan",
  "alibaba-coding-plan-cn",
  "alibaba-token-plan",
  "alibaba-token-plan-cn",
  "opencode",
  "opencode-go",
  "engy",
  "openrouter",
]

# Upstream owns these folders. The feed rewrites only the cost tables of upstream's files, deletes
# a file whose model the provider's live list no longer has, and adds a whole file of its own
# (first line "# Added by the price feed:") for a priced model upstream has no file for, unless
# the feed sets add = false. A rebase conflict there takes upstream's file (the rebase writes the
# price again).
patch = [
  "kenari",
  "alibaba",
  "alibaba-cn",
  "alibaba-coding-plan",
  "alibaba-coding-plan-cn",
  "alibaba-token-plan",
  "alibaba-token-plan-cn",
  "opencode",
  "opencode-go",
  "engy",
  "openrouter",
]
