# "<provider>/<model>" = "<lab>/<model>" for host entries that have no base_model upstream.
# The feed uses this to find a peer's reasoning_options; the price service uses it to match
# a host entry to its lab model.
"opencode-go/deepseek-v4-pro" = "deepseek/deepseek-v4-pro"
# OpenCode Zen ids that drop the lab's suffix; same name and release date as the lab file.
"opencode/claude-sonnet-4" = "anthropic/claude-sonnet-4-0"
"opencode/gemini-3.1-pro" = "google/gemini-3.1-pro-preview"
"opencode/gemini-3-flash" = "google/gemini-3-flash-preview"
# Alibaba CN ids that use dashes where the lab file uses dots.
"alibaba-cn/deepseek-v3-1" = "deepseek/deepseek-v3.1"
"alibaba-cn/moonshot-kimi-k2-instruct" = "moonshotai/kimi-k2-instruct"
"alibaba-cn/qwen2-5-coder-32b-instruct" = "alibaba/qwen2.5-coder-32b-instruct"
