# Price feed: Kenari GET /v1/models (public price list), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: Converted from IDR at 18148 IDR per USD (ECB rate of 2026-11-01, via frankfurter.dev).
# Synced from kenari's public API by the kenari sync module.
# Catalog: GET https://kenari.id/docs/models
# Pricing: GET https://kenari.id/api/public/pricing (usd_idr_rate = 17500, re-read on every sync)
# IDR prices were converted to USD by dividing by that rate: per 1M tokens, or per unit for pricing_lines.
# Docs: https://kenari.id/docs/reasoning
# Effort: reasoning_effort = low|high|max
schema = 2
base_model = "deepseek/deepseek-v4-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[cost.text.input]
price = 0.179083
cache = { read = 0.00523474 }

[cost.text.output]
price = 0.330615
