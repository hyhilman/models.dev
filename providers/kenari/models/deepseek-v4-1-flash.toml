# Price feed: Kenari GET /v1/models (public price list), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: Converted from IDR at 17946 IDR per USD (ECB rate of 2026-10-01, via frankfurter.dev).
# Source: https://kenari.id/v1/models (id deepseek-v4-1-flash, reasoning low/high/max)
# Kenari convention: subscription pricing, cost 0/0 like other Kenari entries.
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.0153237
output = 0.0306475
cache_read = 0.000362198
