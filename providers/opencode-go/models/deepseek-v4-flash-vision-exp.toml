# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-13.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Price feed: peak price now (01:00-04:00 UTC Mon-Fri, 06:00-10:00 UTC Mon-Fri); off-peak the rest of the time is input 0.15, output 0.6.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# https://api-docs.deepseek.com/quick_start/pricing/ (accessed 2026-08-21)
base_model = "deepseek/deepseek-v4-flash-vision-exp"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.3
output = 1.2
cache_read = 0.006
