# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-16.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Sources: https://opencode.ai/docs/go/#endpoints and https://opencode.ai/docs/go/#usage-limits
# Contributor tier: prompts and completions may be used to train future Google models,
# so Go requires the workspace's consent to paid endpoints that train on request data.
base_model = "google/gemini-4-argon"
name = "Gemini 4 Argon Contributor"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

[cost]
input = 4
output = 20
cache_read = 0.2

[provider]
npm = "@ai-sdk/google"
api = "https://opencode.ai/inference/go/google/v1beta"
