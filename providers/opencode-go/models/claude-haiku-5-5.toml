# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Sources: https://opencode.ai/docs/go/#endpoints and https://opencode.ai/docs/go/#usage-limits
# Toggle: thinking.type = adaptive|disabled (disabled only at low, medium, or high effort)
# Effort: output_config.effort = low|medium|high|xhigh|max
# https://platform.claude.com/docs/en/build-with-claude/effort#recommended-effort-levels-for-claude-haiku-5-5
base_model = "anthropic/claude-haiku-5-5"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] }]

[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[[cost.tiers]]
tier = { type = "context", size = 100_000 }
input = 0.5
output = 2.5
cache_read = 0.05
cache_write = 0.625

[provider]
npm = "@ai-sdk/anthropic"
api = "https://opencode.ai/inference/go/anthropic/v1"
