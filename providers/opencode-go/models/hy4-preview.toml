# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Effort: reasoning_effort = none|high (not verified on Go: no Go subscription key was available)
# Mid-conversation flags left out: tencent has no provider file for tencent/hy4-preview to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "tencent/hy4-preview"

[capabilities]
reasoning = { supported = true, effort = ["none", "high"] }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"

[cost.text.input]
price = 0.834
cache = { read = 0.042 }

[cost.text.output]
price = 2.501
