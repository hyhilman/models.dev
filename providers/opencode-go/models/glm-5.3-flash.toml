# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
base_model = "zhipuai/glm-5.3-flash"
name = "GLM-5.3-Flash"
reasoning_options = [{ type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.5
cache_read = 0.03

[provider]
api = "https://opencode.ai/inference/go/openai/v1"
