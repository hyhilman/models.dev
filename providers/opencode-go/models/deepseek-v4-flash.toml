# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Price feed: off-peak price now; the peak price (01:00-04:00 UTC Mon-Fri, 06:00-10:00 UTC Mon-Fri) is input 0.3, output 1.2.
# Effort: reasoning_effort = low|high|max (DeepSeek flash maps low→low; xhigh→high)
# https://api-docs.deepseek.com/guides/thinking_mode/ (accessed 2026-08-02)
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.6
cache_read = 0.003
