# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-16.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
base_model = "meta/muse-spark-1.2"
name = "Muse Spark 1.2 Contributor"

reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0.1
output = 0.2
cache_read = 0.002

[provider]
npm = "@ai-sdk/openai"
api = "https://opencode.ai/inference/go/openai/v1"
