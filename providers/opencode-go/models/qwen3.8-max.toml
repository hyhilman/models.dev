# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-11.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/go.mdx.
# https://opencode.ai/docs/go/#endpoints
# https://help.aliyun.com/en/model-studio/anthropic-api-messages
# Toggle (Messages): thinking.type = enabled|disabled
# Effort (Messages): output_config.effort = low|medium|xhigh
base_model = "alibaba/qwen3.8-max"
description = "2.4-trillion-parameter multimodal flagship for coding, professional work, and long-horizon agentic workflows"
family = "qwen3.8-max"
reasoning_options = [
  { type = "toggle" },
  { type = "effort", values = ["low", "medium", "xhigh"] },
  { type = "budget_tokens", max = 262_144 },
]
structured_output = true

[cost]
input = 2
output = 6
cache_read = 0.25
cache_write = 2.5

[modalities]
input = ["text", "image", "video"]

[provider]
npm = "@ai-sdk/anthropic"
