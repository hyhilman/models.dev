# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Mid-conversation flags unset: Go documents none, and no Go subscription key was available to test them.
# family: kept as "mimo-v2.5-pro" (not the lab's broader family): the OpenCode app shows only the newest model per family by default, so a shared family would hide this model behind a newer sibling.
schema = 2
base_model = "xiaomi/mimo-v2.5-pro"
family = "mimo-v2.5-pro"
name = "MiMo V2.5 Pro"
description = "MiMo pro model for strong multimodal reasoning and agent execution"

[capabilities]
reasoning = { supported = true }

[limit]
output = 128_000

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.435
cache = { read = 0.003625 }

[cost.text.output]
price = 0.87
