# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from each model's own cost in the list, https://opencode.ai/zen/go/v1/models.
# Toggle: thinking.type = enabled|disabled
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/.
# Mid-conversation flags left out: meituan has no provider file for meituan/longcat-2.5 to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "meituan/longcat-2.5"
name = "LongCat 2.5 Free"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
