# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-11.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/go.mdx.
name = "Qwen3.7 Plus"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
family = "qwen3.7-plus"
release_date = "2026-06-02"
last_updated = "2026-06-02"
attachment = true
reasoning = true
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens", max = 262_144 }]
temperature = true
tool_call = true
open_weights = false

[cost]
input = 0.4
output = 1.6
cache_read = 0.04
cache_write = 0.5

[[cost.tiers]]
tier = { type = "context", size = 256_000 }
input = 1.2
output = 4.8
cache_read = 0.12
cache_write = 1.5

[limit]
context = 1_000_000
output = 65_536

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[provider]
npm = "@ai-sdk/anthropic"
