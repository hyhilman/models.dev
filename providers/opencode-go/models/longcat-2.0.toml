# Price feed: OpenCode Go model list (https://opencode.ai/zen/go/v1/models), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/go.mdx.
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/go/ (accessed 2026-10-21).
# Toggle: thinking.type = enabled|disabled (not verified on Go: no Go subscription key was available)
# Mid-conversation flags left out: meituan has no provider file for meituan/longcat-2.0 to follow (Go is a passthrough: opencode.ai/inference/go/... proxies the same upstreams, https://opencode.ai/v2/docs/console/go/).
schema = 2
base_model = "meituan/longcat-2.0"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/go/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.3
cache = { read = 0.006 }

[cost.text.output]
price = 1.2
