name = "MiniMax-M3"
description = "MiniMax multimodal coding model for long-context reasoning and agent tasks"
family = "minimax-m3"
release_date = "2026-05-31"
last_updated = "2026-05-31"
attachment = false
reasoning = true
reasoning_options = [{ type = "toggle" }]
temperature = true
tool_call = true
knowledge = "2025-01"
