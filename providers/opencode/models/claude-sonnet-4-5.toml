# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "Claude Sonnet 4.5"
description = "Balanced Claude model for coding, analysis, agent workflows, and cost control"
family = "claude-sonnet"
release_date = "2025-09-29"
last_updated = "2025-09-29"
attachment = true
reasoning = true
reasoning_options = [{ type = "budget_tokens", min = 1_024 }]
temperature = true
tool_call = true
interleaved = true
knowledge = "2025-07-31"
open_weights = false

[cost]
input = 3
output = 15
cache_read = 0.3
cache_write = 3.75

[[cost.tiers]]
tier = { type = "context", size = 200_000 }
input = 6
output = 22.5
cache_read = 0.6
cache_write = 7.5

[limit]
context = 1_000_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/anthropic"
