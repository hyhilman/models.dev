# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "GPT-5 Nano"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-nano"
release_date = "2025-08-07"
last_updated = "2025-08-07"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]
temperature = false
knowledge = "2024-05-30"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 0.05
output = 0.4
cache_read = 0.005

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]

[provider]
npm = "@ai-sdk/openai"
api = "https://opencode.ai/inference/openai/v1"
