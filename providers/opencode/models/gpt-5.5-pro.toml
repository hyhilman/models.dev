# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "GPT-5.5 Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt-pro"
release_date = "2026-04-24"
last_updated = "2026-04-24"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["medium", "high", "xhigh"] }]
temperature = false
knowledge = "2025-12-01"
tool_call = true
structured_output = false
open_weights = false

[cost]
input = 30
output = 180
cache_read = 30

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/openai"
api = "https://opencode.ai/inference/openai/v1"
