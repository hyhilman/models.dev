# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/site/src/docs/content/console/models.mdx.
# Toggle: thinking.type = enabled|disabled
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/.
# Mid-conversation flags left out: meituan has no provider file for meituan/longcat-2.5 to follow (Zen passes requests through).
schema = 2
base_model = "meituan/longcat-2.5"
name = "LongCat 2.5 Free"

[capabilities]
reasoning = { supported = true, toggle = true }

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
