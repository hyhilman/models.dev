# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-11-09.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/site/src/docs/content/console/models.mdx.
schema = 2
base_model = "thinkingmachines/inkling-2-small"
name = "Inkling 2 Small Free"
description = "Inkling 2 Small, free for a limited time"

[capabilities]
reasoning = { supported = true, effort = ["none", "minimal", "low", "medium", "high", "max"] }

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
