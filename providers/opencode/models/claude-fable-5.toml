# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-16.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
base_model = "anthropic/claude-fable-5"

[[reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[cost]
input = 10
output = 50
cache_read = 1
cache_write = 12.5

[provider]
npm = "@ai-sdk/anthropic"
api = "https://opencode.ai/inference/anthropic/v1"
