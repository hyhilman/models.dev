# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "Gemini 3.5 Flash"
description = "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
family = "gemini-flash"
release_date = "2026-05-19"
last_updated = "2026-05-19"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["minimal", "low", "medium", "high"] }]
temperature = true
tool_call = true
structured_output = true
knowledge = "2025-01"
open_weights = false

[cost]
input = 1.5
output = 9
cache_read = 0.15

[limit]
context = 1_048_576
output = 65_536

[modalities]
input = ["text", "image", "video", "audio", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/google"
api = "https://opencode.ai/inference/google/v1beta"
