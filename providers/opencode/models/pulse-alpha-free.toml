# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-11-06.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
# Pricing and endpoint (Chat Completions): https://opencode.ai/v2/docs/console/models/.
# Modalities, capabilities, effort levels and limits supplied by the operator on 2026-11-02.
schema = 2
name = "Pulse Alpha Free"
description = "Stealth reasoning model with text and image input and tool use"
open_weights = false
release_date = "2026-11-02"
status = "deprecated"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["low", "high", "max"] }
temperature = true

[limit]
context = 1_048_576
output = 131_072

[api.chat-completions]
base_url = "https://opencode.ai/inference/openai/v1"

[cost.text.input]
price = 0
cache = { read = 0 }

[cost.text.output]
price = 0
