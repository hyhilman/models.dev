# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "GPT-5.4 Mini"
description = "Compact GPT model for low-latency assistance and high-volume workloads"
family = "gpt-mini"
release_date = "2026-03-17"
last_updated = "2026-03-17"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]
temperature = false
knowledge = "2025-08-31"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 0.75
output = 4.5
cache_read = 0.075

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/openai"
