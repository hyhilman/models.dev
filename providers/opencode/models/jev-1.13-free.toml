# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/site/src/docs/content/console/models.mdx.
# Availability: https://opencode.ai/zen/v1/models
# Pricing and endpoint (System One, POST /systemone): https://opencode.ai/v2/docs/console/models/ (accessed 2026-10-21).
# Mid-conversation flags left out: typesafe has no provider file for typesafe/jev-1.13.0 to follow (Zen passes requests through).
schema = 2
base_model = "typesafe/jev-1.13.0"
name = "Jev 1.13 Free"

[capabilities]
structured_output = true

[api.systemone]
base_url = "https://opencode.ai/inference/systemone/v1"
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/opencode/decisions" }

[cost.text.input]
price = 0

[cost.text.output]
price = 0
