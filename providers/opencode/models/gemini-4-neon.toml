# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/site/src/docs/content/console/models.mdx.
# Pricing: https://ai.google.dev/gemini-api/docs/pricing#gemini-4-neon
# $3 / $15 / $0.15 cache read per 1M, flat across the 1M-token context window (no introductory discount).
# Effort: generationConfig.thinkingConfig.thinkingLevel = low|medium|high|xhigh, default high (https://ai.google.dev/gemini-api/docs/whats-new-gemini-4-neon).
# Cache: implicit only (explicit caching is not supported).
# Tools follow Google's Gemini API: https://ai.google.dev/gemini-api/docs/function-calling#function-calling-modes; Zen passes requests through.
# recommended_api: Zen serves this model on Google's Interactions API (/inference/google/v1beta/interactions), verified 2026-11-20 with streamed tool calls.
schema = 2
base_model = "google/gemini-4-neon"
recommended_api = "interactions"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, default = { type = "effort", value = "high" }, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
cache = { implicit = true }

[api.generate-content]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google" }

[api.interactions]
base_url = "https://opencode.ai/inference/google/v1beta"
sdk = { aisdk = "@ai-sdk/google", opencodeai = "@opencode/ai/providers/google/interactions" }

[cost.text.input]
price = 3
cache = { read = 0.15 }

[cost.text.output]
price = 15
