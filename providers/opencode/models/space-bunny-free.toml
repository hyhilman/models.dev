# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "Space Bunny Free"
description = "Anonymous preview reasoning model for coding, agentic tasks, tool use, and multimodal input"
release_date = "2026-09-23"
last_updated = "2026-09-23"

attachment = true
reasoning = true
reasoning_options = [
  { type = "effort", values = ["low", "medium", "high", "xhigh", "max"] },
]
tool_call = true
