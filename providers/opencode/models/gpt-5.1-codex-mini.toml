# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "GPT-5.1 Codex Mini"
description = "Coding-optimized GPT model for repository edits, reviews, and agentic software work"
family = "gpt-codex"
release_date = "2025-11-13"
last_updated = "2025-11-13"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }]
temperature = false
knowledge = "2024-09-30"
tool_call = true
structured_output = true
open_weights = false

[cost]
input = 0.25
output = 2
cache_read = 0.025

[limit]
context = 400_000
input = 272_000
output = 128_000

[modalities]
input = ["text", "image"]
output = ["text"]

[provider]
npm = "@ai-sdk/openai"
api = "https://opencode.ai/inference/openai/v1"
