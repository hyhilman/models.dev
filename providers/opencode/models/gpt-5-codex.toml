# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
# Docs: listed under Deprecated models (July 23, 2026) (https://opencode.ai/v2/docs/console/models/#deprecated-models, accessed 2026-10-21).
# status left unset: GET https://opencode.ai/inference/v1/models still lists this ID (2026-10-21) and requests return 403 "Model access is disabled" (a workspace toggle), not the 410 Zen returns for retired IDs, and OpenCode hides deprecated models, so marking it would drop a model Zen still serves.
# Effort: reasoning.effort = low|medium|high (deprecated; not re-verified on Zen)
schema = 2
base_model = "openai/gpt-5-codex"
name = "GPT-5 Codex"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true

[api.responses]
base_url = "https://opencode.ai/inference/openai/v1"
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai/responses" }

[cost.text.input]
price = 1.07
cache = { read = 0.107 }

[cost.text.output]
price = 8.5
