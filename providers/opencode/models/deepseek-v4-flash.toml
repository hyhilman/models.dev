# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-11.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/zen.mdx.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max (DeepSeek flash maps low→low; xhigh→high)
# https://api-docs.deepseek.com/guides/thinking_mode/ (accessed 2026-08-02)
base_model = "deepseek/deepseek-v4-flash-0731"
name = "DeepSeek V4 Flash"
reasoning_options = [{ type = "toggle" }, { type = "effort", values = ["low", "high", "max"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.14
output = 0.28
cache_read = 0.028
