# Price feed: OpenCode Zen model list (https://opencode.ai/zen/v1/models), checked 2026-10-12.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: prices from OpenCode's docs source, https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx.
name = "Claude Opus 4.5"
description = "Flagship Claude model for deep reasoning, coding, and long-horizon agents"
family = "claude-opus"
release_date = "2025-11-24"
last_updated = "2025-11-24"
attachment = true
reasoning = true
reasoning_options = [{ type = "effort", values = ["low", "medium", "high"] }, { type = "budget_tokens", min = 1_024 }]
temperature = true
tool_call = true
knowledge = "2025-03-31"
open_weights = false

[cost]
input = 5
output = 25
cache_read = 0.5
cache_write = 6.25

[limit]
context = 200_000
output = 64_000

[modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[provider]
npm = "@ai-sdk/anthropic"
