# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Liquid)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "LFM2.5-24B-A2B"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "liquid"
open_weights = true
release_date = "2026-10-13"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 128_000
output = 8_192

[cost.text.input]
price = 0.05275
cache = { read = 0.026375 }

[cost.text.output]
price = 0.7385
