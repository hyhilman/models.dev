# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded to Grok in place (live: cache prefix kept)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: automatic (https://openrouter.ai/docs/guides/best-practices/prompt-caching#grok)
schema = 2
name = "Grok 4.20"
description = "Grok model for agentic tool use, reasoning, coding, and live assistance"
family = "grok"
open_weights = false
knowledge = "2025-09-01"
release_date = "2026-03-31"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
temperature = true
system_updates = true
effort_updates = false
cache = { supported = true, implicit = true }

[limit]
context = 2_000_000
output = 1_800_000

[cost.text.input]
price = 1.31875
cache = { read = 0.211 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.6375
cache = { read = 0.422 }

[cost.text.output]
price = 2.6375

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 5.275
