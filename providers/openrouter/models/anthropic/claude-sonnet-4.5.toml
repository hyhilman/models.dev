# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted into the system prompt for this Claude model (live: cache prefix lost)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: cache_control (top-level or per block), 4 breakpoints, 5m/1h TTL, 1h write = 2x input; min tokens per model (https://openrouter.ai/docs/guides/best-practices/prompt-caching#anthropic-claude)
schema = 2
base_model = "anthropic/claude-sonnet-4-5"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true }
structured_output = true
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, min_tokens = 1_024 } }

[limit]
context = 1_000_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 3.165
cache = { read = 0.3165, write = 3.95625 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 6.33
cache = { read = 0.633, write = 7.9125 }

[cost.text.output]
price = 15.825

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 23.7375
