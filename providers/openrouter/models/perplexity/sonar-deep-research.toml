# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
schema = 2
name = "Sonar Deep Research"
description = "Sonar search model for current answers, retrieval, and citation-backed chat"
family = "sonar-deep-research"
open_weights = false
release_date = "2025-03-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, toggle = true }
structured_output = false
temperature = true
effort_updates = false

[limit]
context = 128_000
output = 115_200

[cost.text.input]
price = 2.11

[cost.text.output]
price = 8.44
reasoning = 3.165
