# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
schema = 2
type = "decision"
name = "Decider V1.2"
description = "Decision model for typed evaluation of shared state"
open_weights = false
release_date = "2026-10-16"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
temperature = false

[limit]
context = 262_144
output = 0

[cost.text.input]
price = 0.0211

[cost.text.output]
price = 0
