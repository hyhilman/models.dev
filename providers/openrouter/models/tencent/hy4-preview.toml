# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices.
# Price feed: off-peak price now (16:00-00:00 UTC); the peak price is input 0.834, output 2.501.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Tencent, DeepInfra)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "tencent/hy4-preview"
description = "Tencent Hy reasoning model for coding, instruction following, and agent tasks"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "high"] }
structured_output = true
system_updates = true
effort_updates = false

[limit]
context = 1_048_576

[cost.text.input]
price = 0.7506
cache = { read = 0.0378 }

[cost.text.output]
price = 2.2509
