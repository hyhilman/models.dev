# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Venice (live)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "cognitivecomputations/dolphin-mistral-24b-venice-edition"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.2

[cost.text.output]
price = 0.9
