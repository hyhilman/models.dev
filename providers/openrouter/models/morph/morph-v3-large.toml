# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "morph/morph-v3-large"
description = "Flagship model for demanding analysis, coding, and production agent workflows"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
effort_updates = false

[cost.text.input]
price = 0.9

[cost.text.output]
price = 1.9
