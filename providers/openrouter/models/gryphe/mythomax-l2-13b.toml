# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Parasail (live)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "gryphe/mythomax-l2-13b"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
system_updates = false
effort_updates = false

[limit]
context = 8_192
output = 3_686

[cost.text.input]
price = 0.0844

[cost.text.output]
price = 0.11605
