# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
name = "Qwen2.5 72B Instruct"
description = "Qwen instruction model for multilingual chat, reasoning, and tool use"
family = "qwen"
open_weights = true
knowledge = "2024-06-30"
release_date = "2024-09-19"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = false }
structured_output = true
temperature = true
effort_updates = false

[limit]
context = 32_768
output = 16_384

[cost.text.input]
price = 0.3798

[cost.text.output]
price = 0.422
