# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: hoisted on Alibaba (live)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "alibaba/qwen3-coder-flash"

[capabilities]
tools = { supported = true, updates = false }
structured_output = false
system_updates = false
effort_updates = false

[cost.text.input]
price = 0.205725
cache = { read = 0.041145, write = 0.257156 }

[[cost.text.input.overrides]]
when = { context = { gt = 32_000 } }
price = 0.342875
cache = { read = 0.068575, write = 0.428594 }

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.5486
cache = { read = 0.10972, write = 0.68575 }

[cost.text.output]
price = 1.02862

[[cost.text.output.overrides]]
when = { context = { gt = 32_000 } }
price = 1.71437

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 2.743
