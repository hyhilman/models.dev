# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
schema = 2
base_model = "alibaba/qwen4-max"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "high", "xhigh"] }
structured_output = true
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }

[limit]
output = 131_072

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 1.50337
cache = { read = 0.0751687, write = 1.87922 }

[cost.text.output]
price = 4.51013
