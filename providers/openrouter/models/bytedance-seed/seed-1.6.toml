# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Toggle: reasoning.enabled = true|false
# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding; video: https://openrouter.ai/docs/guides/overview/multimodal/videos
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Deprecated: GET /api/v1/models lists expiration_date 2026-11-11
schema = 2
base_model = "bytedance-seed/seed-1-6"
description = "Multimodal reasoning model for visual analysis, planning, and tool use"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true }
structured_output = true
effort_updates = false

[limit]
context = 262_144
output = 32_768

[cost.text.input]
price = 0.26375

[[cost.text.input.overrides]]
when = { context = { gt = 128_000 } }
price = 0.5275

[cost.text.output]
price = 2.11

[[cost.text.output.overrides]]
when = { context = { gt = 128_000 } }
price = 4.22
