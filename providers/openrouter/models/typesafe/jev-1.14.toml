# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Modalities: OpenRouter says "Jev accepts only image/png and image/jpeg" (https://openrouter.ai/docs/guides/community/multimodal-decisions), matching the lab (https://docs.typesafe.ai/images.md)
schema = 2
base_model = "typesafe/jev-1.14.0"
type = "decision"
description = "Decision model for typed evaluation of shared state"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = false

[limit]
context = 262_144

[api.systemone]
sdk = { aisdk = "@ai-sdk/typesafe-ai", opencodeai = "@opencode/ai/providers/openrouter/decisions" }
compatibility = { media_input = "state" }

[cost.text.input]
price = 0.04431

[cost.text.output]
price = 0
