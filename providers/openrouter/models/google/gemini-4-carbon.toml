# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation, tool and cache flags backfilled 2026-11-18 from gemini-4-argon.toml on this host (same API layout; the sync doesn't carry them).
schema = 2
base_model = "google/gemini-4-carbon"
description = "Gemini multimodal model for text, image, audio, video, and document tasks"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high"] }
structured_output = true
temperature = true
cache = { implicit = true, explicit = { ttl = ["5m"], max_breakpoints = 1 } }

[limit]
output = 943_718

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 2.11
cache = { read = 0.1055, write = 0.197813 }

[cost.text.output]
price = 10.55
reasoning = 10.55
