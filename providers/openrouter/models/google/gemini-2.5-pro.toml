# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: implicit on Gemini 2.5+; cache_control uses only the last breakpoint, 5m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# Deprecated: GET /api/v1/models lists expiration_date 2026-10-20
schema = 2
base_model = "google/gemini-2.5-pro"
status = "deprecated"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, budget = { min = 128, max = 32_768 } }
structured_output = true
system_updates = false
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 4_096 }, explicit = { ttl = ["5m"], max_breakpoints = 1, min_tokens = 4_096 } }

[cost.text.input]
price = 1.31875
cache = { read = 0.131875, write = 0.395625 }

[[cost.text.input.overrides]]
when = { context = { gt = 200_000 } }
price = 2.6375
cache = { read = 0.26375 }

[cost.text.output]
price = 10.55
reasoning = 10.55

[[cost.text.output.overrides]]
when = { context = { gt = 200_000 } }
price = 15.825
