# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = false: Gemini has one systemInstruction, so it is hoisted (live: cache prefix lost; https://openrouter.ai/docs/guides/best-practices/prompt-caching#google-gemini)
# effort_updates = false: no per-turn effort control
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "google/gemini-3-pro-image"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true }
structured_output = true

[limit]
context = 131_072

[api.chat-completions]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openrouter/images" }

[cost.text.input]
price = 2.11
cache = { read = 0.211, write = 0.395625 }

[cost.text.output]
price = 12.66
reasoning = 12.66
