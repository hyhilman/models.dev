# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates unset: live probes showed no cache signal, so placement is unknown
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
schema = 2
base_model = "sakana/fugu-ultra-v2"
description = "Quality-first multi-agent model for hard research, analysis, and competitions"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["high", "xhigh", "max"] }
structured_output = true
effort_updates = false

[cost.text.input]
price = 5.275
cache = { read = 0.5275 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 10.55
cache = { read = 1.055 }

[cost.text.output]
price = 31.65

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 47.475
