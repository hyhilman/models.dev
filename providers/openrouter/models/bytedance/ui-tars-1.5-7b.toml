# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Parasail)
# effort_updates = false: no per-turn effort control
schema = 2
name = "UI-TARS 7B "
description = "Multimodal model for analyzing text, images, documents, and rich media"
open_weights = true
knowledge = "2025-01-31"
release_date = "2025-07-22"

[modalities]
input = ["image/png", "image/jpeg", "image/webp", "image/gif", "text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
temperature = true
system_updates = true
effort_updates = false

[limit]
context = 128_000
output = 2_048

[cost.text.input]
price = 0.1055
cache = { read = 0.1055 }

[cost.text.output]
price = 0.211
