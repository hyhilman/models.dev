# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices.
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: forwarded in place (live: cache prefix kept on Parasail)
# effort_updates = false: no per-turn effort control
schema = 2
base_model = "sao10k/l3-lunaris-8b"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
structured_output = true
system_updates = true
effort_updates = false

[cost.text.input]
price = 0.04

[cost.text.output]
price = 0.05
