# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Mid-conversation: system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live 2026-10-23 on gpt-4.1-nano pinned to OpenAI: cache kept and followed on Chat Completions, Responses and Messages)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# Cache: automatic from 1,024 tokens (https://openrouter.ai/docs/guides/best-practices/prompt-caching#openai)
schema = 2
base_model = "openai/gpt-5.4-image-2"
description = "Image model for prompt-driven generation, editing, and visual design workflows"

[capabilities]
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh"] }
structured_output = true
system_updates = true
cache = { implicit = { min_tokens = 1_024 } }

[api.chat-completions]

[api.images]
sdk = { opencodeai = "@opencode/ai/providers/openrouter/images" }

[cost.text.input]
price = 8.44
cache = { read = 2.11 }

[cost.text.output]
price = 15.825
