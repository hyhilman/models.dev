# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-11-20.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
schema = 2
name = "GPT-6.2 Astra Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
open_weights = false
release_date = "2026-11-17"

[modalities]
input = ["application/pdf", "image", "text"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false

[limit]
context = 1_050_000
output = 128_000

[api.chat-completions]

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/openai-compatible/responses" }

[api.messages]
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/anthropic-compatible" }

[cost.text.input]
price = 8.44
cache = { read = 0.422, write = 10.55 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 16.88
cache = { read = 0.844, write = 21.1 }

[cost.text.output]
price = 42.2

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 63.3
