# Price feed: OpenRouter GET /api/v1/models (public price list), checked 2026-10-23.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: USD list prices. Times 1.055 for the host's fee.
# Modalities (OpenRouter's documented formats, narrowed to the lab's list where it has one): image: https://openrouter.ai/docs/guides/overview/multimodal/image-understanding
# Mid-conversation (Chat Completions, probed 2026-10-19): system_updates = true: OpenAI keeps mid-conversation system/developer messages in place (live: cache prefix kept on gpt-4.1, gpt-5.4, gpt-6-sol)
# effort_updates = false: configuration_update is rejected with a 400 for this model (https://openrouter.ai/docs/guides/best-practices/reasoning-tokens#mid-conversation-effort)
# tools.updates = false: Chat Completions rejects tool_addition/tool_removal for non-Claude-4.8+ models (live 400)
# Cache: automatic from 1,024 tokens; GPT-5.6+ explicit prompt_cache_breakpoint, 30m TTL (https://openrouter.ai/docs/guides/best-practices/prompt-caching#openai)
schema = 2
name = "GPT-6 Sol Pro"
description = "Frontier GPT model for professional reasoning, coding, and multimodal work"
family = "gpt"
open_weights = false
release_date = "2026-09-22"

[modalities]
input = ["application/pdf", "image/png", "image/jpeg", "image/webp", "image/gif", "text"]
output = ["text"]

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
system_updates = true
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m"], min_tokens = 1_024 } }

[limit]
context = 1_050_000
output = 128_000

[cost.text.input]
price = 2.11
cache = { read = 0.211, write = 2.6375 }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 4.22
cache = { read = 0.422, write = 5.275 }

[cost.text.output]
price = 10.55

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 15.825
