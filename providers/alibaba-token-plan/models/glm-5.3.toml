# Price feed: Alibaba Token Plan model list (https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: price of alibaba (its own list) x 1: the plan bills in Credits, and Alibaba publishes no Credit rate per model.
# Alibaba Token Plan (Singapore) lists model ID glm-5.3 (Zhipu AI).
# Subscription plan: no per-token USD price (Credits billing).
# Always-on thinking; effort via reasoning_effort = low|high|max (default max).
# Same control surface as Model Studio glm-5.3 / lab peers; thinking cannot be
# disabled (no toggle). Interleaved reasoning on reasoning_content.
# https://docs.modelstudio.console.alibabacloud.com/en/model-studio/token-plan-personal-overview
# https://docs.modelstudio.console.alibabacloud.com/en/model-studio/token-plan-team-overview
# https://docs.z.ai/guides/llm/glm-5.3
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
base_model = "zhipuai/glm-5.3"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 1.4
cache = { read = 0.28 }

[cost.text.output]
price = 4.4
