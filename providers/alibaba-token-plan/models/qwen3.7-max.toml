# Price feed: Alibaba Token Plan model list (https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models), checked 2026-10-11.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: price of alibaba (its own list) x 1: the plan bills in Credits, and Alibaba publishes no Credit rate per model.
base_model = "alibaba/qwen3.7-max"
# Reasoning HTTP format (accessed 2026-06-25):
# Hybrid, thinking on by default. Chat/DashScope `enable_thinking`: true|false;
# integer `thinking_budget` maximum 262144; no minimum or disable sentinel is
# documented. Responses instead uses `reasoning.effort` and no numeric budget.
# structured_output: the Token Plan gateway accepts response_format json_schema
# (probed 2026-07-24) even though the base model / console report none. Reasoning
# streams in `reasoning_content` (hence [interleaved]).
# Output ceiling 131,072 (probed 2026-07-24: accepts max_tokens 131,072,
# rejects 131,073) is double the base model's 65,536 and double its sibling
# qwen3.7-plus, so output is overridden below.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/deep-thinking
# https://www.alibabacloud.com/help/en/model-studio/compatibility-with-openai-responses-api

structured_output = true
reasoning_options = [{ type = "toggle" }, { type = "budget_tokens", max = 262_144 }]

[interleaved]
field = "reasoning_content"

[cost]
input = 2.5
output = 7.5
cache_read = 0.25
cache_write = 3.125

[limit]
output = 131_072
