# Price feed: Alibaba Token Plan model list (https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models), checked 2026-10-31.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: price of alibaba (its own list) x 1: the plan bills in Credits, and Alibaba publishes no Credit rate per model.
# Price feed: off-peak price now (22:00-08:00 UTC+8); the peak price is input 1.32, output 3.96.
# Reasoning HTTP format (accessed 2026-08-15):
# This model toggles with `enable_thinking`: true or false. Chat Completions
# `reasoning_effort` accepts high (default) or max; low/medium map to high and
# xhigh maps to max. Anthropic Messages defaults `reasoning_effort` to max.
# Model availability: authenticated Alibaba Token Plan model selector.
# Sources:
# https://www.alibabacloud.com/help/en/model-studio/token-plan-overview
# https://www.alibabacloud.com/help/en/model-studio/deepseek-api
# https://www.alibabacloud.com/help/en/model-studio/anthropic-api-messages
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions (the DeepSeek, Kimi and MiniMax series do not support top_k).
# Tools: tool_choice auto|none|required|named on every API except Responses (no required with more than one tool); no strict tool mode (sources in provider.toml).
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["high", "max"] }
structured_output = true
top_k = false

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[api.responses]
sdk = { aisdk = "@ai-sdk/openai", opencodeai = "@opencode/ai/providers/alibaba/responses" }
capabilities = { tools = { choice = ["auto", "none", "tool"] } }

[api.messages]
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic/v1"
sdk = { aisdk = "@ai-sdk/anthropic", opencodeai = "@opencode/ai/providers/alibaba/messages" }

[cost.text.input]
price = 0.66
cache = { read = 0.066 }

[cost.text.output]
price = 1.98
