# Price feed: Alibaba Token Plan model list (https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/models), checked 2026-10-22.
# Price feed: only [cost] is ours, written by local/script/apply-static.ts; the rest is upstream's.
# Price feed: price of alibaba (its own list) x 1: the plan bills in Credits, and Alibaba publishes no Credit rate per model.
# Sources (accessed 2026-08-27):
# https://docs.qwencloud.com/token-plan/personal/token-plan-personal-overview
# https://www.qwencloud.com/models/qwen3.8-flash
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# https://docs.qwencloud.com/api-reference/chat/openai-chat
# Toggle: enable_thinking true|false (hybrid)
# Effort: reasoning_effort = low|medium|xhigh (not yet in the API reference; see
# the Qwen3.8-Flash-Next release blog)
# Budget: thinking_budget (Max Reasoning 262K)
# Reasoning streams in reasoning_content.
# Cost is Credits-subscription (no public USD per-token rate on Token Plan).
# Mid-conversation: tools are a request-level parameter with no add/remove mechanism (tools.updates = false); not probed live (no plan key), so system_updates and effort_updates are left unset. Chat API: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions.
schema = 2
base_model = "alibaba/qwen3.8-flash"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "xhigh"], budget = { max = 262_144 } }
structured_output = true

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.016, write = 0.2 }

[cost.text.output]
price = 0.47
